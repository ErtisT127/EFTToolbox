          '200':
            {
              description: Candidates,
              content:
                {
                  application/json:
                    { schema: { $ref: './proto/data.schema.json#/$defs/RecognitionCandidates' } },
                },
            },
        }
  /api/recognition/result:
    post:
      operationId: postRecognitionResult
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: './proto/data.schema.json#/$defs/RecognitionResult' } },
            },
        }
      responses: { '204': { description: Result accepted } }
  /api/game-monitor/position:
    post:
      operationId: updateGameMonitorPosition
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: './proto/data.schema.json#/$defs/ManualPositionUpdate' } },
