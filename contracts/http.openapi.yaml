  /api/overlay-settings:
    get:
      operationId: getOverlaySettings
      responses: { '200': { $ref: '#/components/responses/VersionedOverlaySettings' } }
    put:
      operationId: putOverlaySettings
      parameters: [{ $ref: '#/components/parameters/ExpectedRevision' }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: './proto/data.schema.json#/$defs/OverlaySettings' } },
            },
        }
      responses:
        {
          '200': { $ref: '#/components/responses/VersionedOverlaySettings' },
          '409': { $ref: '#/components/responses/RevisionConflict' },
          '428': { $ref: '#/components/responses/RevisionRequired' },
        }
  /api/overlay/state:
    get:
      operationId: getOverlayState
      responses:
        {
          '200':
            {
              description: Overlay state,
              content:
                {
                  application/json:
                    { schema: { $ref: './proto/data.schema.json#/$defs/OverlayView' } },
                },
            },
        }
    put:
      operationId: putOverlayState
      requestBody:
        {
          required: true,
          content:
            {
              application/json: { schema: { $ref: './proto/data.schema.json#/$defs/OverlayView' } },
            },
        }
      responses:
        {
          '200':
            {
              description: Overlay state,
              content:
                {
                  application/json:
                    { schema: { $ref: './proto/data.schema.json#/$defs/OverlayView' } },
                },
            },
        }
  /api/overlay/command:
    post:
      operationId: postOverlayCommand
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: './proto/data.schema.json#/$defs/OverlayCommand' } },
            },
        }
      responses:
        {
          '204': { description: Command accepted },
          '400': { $ref: '#/components/responses/Error' },
        }
  /api/recognition-settings:
    get:
      operationId: getRecognitionSettings
      responses:
        {
          '200':
            {
              description: Recognition settings,
              content:
                {
                  application/json:
                    { schema: { $ref: './proto/data.schema.json#/$defs/RecognitionSettings' } },
