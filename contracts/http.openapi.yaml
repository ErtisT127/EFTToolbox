        }
      responses: { '204': { description: Position accepted } }
  /api/game-monitor/settings:
    get:
      operationId: getGameMonitorSettings
      responses:
        {
          '200':
            {
              description: Monitor settings,
              content:
                {
                  application/json:
                    { schema: { $ref: './proto/data.schema.json#/$defs/GameMonitorSettings' } },
                },
            },
        }
    put:
      operationId: putGameMonitorSettings
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: './proto/data.schema.json#/$defs/GameMonitorSettings' } },
            },
        }
      responses:
        {
          '200':
            {
              description: Monitor settings,
              content:
                {
                  application/json:
                    { schema: { $ref: './proto/data.schema.json#/$defs/GameMonitorSettings' } },
                },
            },
        }
  /api/game-monitor/status:
    get:
      operationId: getGameMonitorStatus
      responses:
        {
          '200':
            {
              description: Monitor status,
              content:
                {
                  application/json:
                    { schema: { $ref: './proto/data.schema.json#/$defs/GameMonitorStatus' } },
                },
            },
        }
  /api/game-monitor/browse/{kind}:
    post:
      operationId: browseGameMonitor
      parameters: [{ name: kind, in: path, required: true, schema: { type: string } }]
      responses: { '204': { description: Browse request accepted } }
  /api/items:
    get:
      operationId: getItemsCatalog
      responses:
        {
          '200':
            {
              description: Items catalog,
              content:
                {
                  application/json:
                    { schema: { $ref: './proto/data.schema.json#/$defs/ItemsCatalog' } },
                },
            },
        }
  /api/items-settings:
    get:
      operationId: getItemsSettings
      responses: { '200': { $ref: '#/components/responses/VersionedItemsSettings' } }
    put:
      operationId: putItemsSettings
      parameters: [{ $ref: '#/components/parameters/ExpectedRevision' }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: './proto/data.schema.json#/$defs/ItemsSettings' } },
            },
        }
      responses:
        {
          '200': { $ref: '#/components/responses/VersionedItemsSettings' },
          '409': { $ref: '#/components/responses/RevisionConflict' },
          '428': { $ref: '#/components/responses/RevisionRequired' },
        }
  /api/items/update:
    get:
      operationId: getItemsUpdateStatus
      responses:
        {
          '200':
            {
              description: Update status,
              content:
                {
                  application/json:
                    { schema: { $ref: './proto/data.schema.json#/$defs/ItemsUpdateStatus' } },
                },
            },
        }
    post:
      operationId: startItemsUpdate
      requestBody:
        {
          required: false,
          content:
            {
              application/json:
                { schema: { $ref: './proto/data.schema.json#/$defs/ItemsUpdateRequest' } },
            },
        }
      responses: { '202': { description: Update started } }
  /api/items/update/cancel:
    post:
      operationId: cancelItemsUpdate
      responses: { '204': { description: Update cancelled } }
  /api/multiplayer/settings:
    get:
      operationId: getMultiplayerSettings
      responses: { '200': { $ref: '#/components/responses/VersionedMultiplayerSettings' } }
    put:
      operationId: putMultiplayerSettings
      parameters: [{ $ref: '#/components/parameters/ExpectedRevision' }]
      requestBody:
        {
