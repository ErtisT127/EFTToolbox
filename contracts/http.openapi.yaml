                  application/json:
                    { schema: { $ref: './proto/data.schema.json#/$defs/MultiplayerStatus' } },
                },
            },
        }
  /api/multiplayer/interfaces:
    get:
      operationId: getMultiplayerInterfaces
      responses:
        {
          '200':
            {
              description: Interfaces,
              content: { application/json: { schema: { type: array, items: { type: string } } } },
            },
        }
  /api/multiplayer/host:
