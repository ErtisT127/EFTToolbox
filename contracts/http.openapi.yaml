      operationId: stopCast
      responses: { '204': { description: Cast stopped } }
  /api/data/open:
    get:
      operationId: openCalibrationData
      responses: { '204': { description: Directory opened } }
  /api/data/open-user-settings:
    get:
      operationId: openUserSettingsData
      responses: { '204': { description: Directory opened } }
  /api/data/reset-calibration:
    post:
      operationId: resetCalibration
      responses:
        {
          '200':
            {
              description: Calibration reset,
              content:
                {
                  application/json:
                    {
                      schema:
                        { type: object, required: [ok], properties: { ok: { type: boolean } } },
                    },
                },
            },
        }
  /api/data/reset-user-settings:
    post:
      operationId: resetUserSettings
      responses: { '200': { $ref: '#/components/responses/VersionedUserSettings' } }
  /api/data/reset/{kind}:
    post:
      operationId: resetData
      parameters: [{ name: kind, in: path, required: true, schema: { type: string } }]
      responses:
        {
          '200':
            {
              description: Data reset,
              content:
                {
                  application/json:
                    {
                      schema:
                        { type: object, required: [ok], properties: { ok: { type: boolean } } },
                    },
                },
            },
        }
  /api/map-tiles/{map}/{layer}/{z}/{x}/{y}:
    get:
      operationId: getMapTile
      parameters:
        - { name: map, in: path, required: true, schema: { type: string } }
        - { name: layer, in: path, required: true, schema: { type: string } }
        - { name: z, in: path, required: true, schema: { type: integer } }
        - { name: x, in: path, required: true, schema: { type: integer } }
        - { name: y, in: path, required: true, schema: { type: integer } }
      responses:
        {
          '200':
            {
              description: Tile,
              content:
                {
                  image/png: { schema: { type: string, format: binary } },
                  image/jpeg: { schema: { type: string, format: binary } },
                },
            },
        }
  /api/assets/{path}:
    get:
      operationId: getAsset
      parameters: [{ name: path, in: path, required: true, schema: { type: string } }]
      responses:
        {
          '200':
            {
              description: Static asset,
              content: { '*/*': { schema: { type: string, format: binary } } },
            },
        }
  /api/update:
    get:
      operationId: getUpdateStatus
      description: Whether a newer release exists. The backend asks GitHub at most once per throttle window unless force is set.
      parameters:
        [{ name: force, in: query, required: false, schema: { type: string, enum: ['1'] } }]
      responses:
        {
          '200':
            {
              description: Update status,
              content:
                {
                  application/json:
                    { schema: { $ref: './proto/data.schema.json#/$defs/UpdateStatus' } },
                },
            },
          '502': { $ref: '#/components/responses/Error' },
        }
components:
  parameters:
    MapId: { name: id, in: path, required: true, schema: { type: string } }
    Locale: { name: locale, in: query, required: false, schema: { type: string, enum: [zh, en] } }
    Basemap: { name: basemap, in: query, required: true, schema: { type: string } }
    ExpectedRevision:
      name: If-Match
      in: header
      required: true
      description: Use If-Match or the equivalent X-Expected-Revision header.
      schema: { type: string, minLength: 1 }
      x-alternatives: [{ $ref: '#/components/parameters/XExpectedRevision' }]
    XExpectedRevision:
      name: X-Expected-Revision
      in: header
      required: false
      description: Alternative conditional revision header accepted by versioned PUT operations.
      schema: { type: string, minLength: 1 }
  headers:
    ETag: { description: Strong content revision, schema: { type: string } }
    X-Revision: { description: Content hash revision, schema: { type: string } }
