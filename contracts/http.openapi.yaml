openapi: 3.1.0
info:
  title: EFTToolbox HTTP API
  version: 1.0.0
  description: Go backend runtime is authoritative; clients consume generated operations and data schemas.
servers:
  - url: /
paths:
  /api/status:
    get:
      operationId: getStatus
      responses:
        '200':
          {
            description: Backend status,
            content:
              { application/json: { schema: { $ref: './proto/data.schema.json#/$defs/Status' } } },
          }
  /api/logs:
    post:
      operationId: appendLog
      requestBody:
        {
          required: true,
          content:
            {
              application/json: { schema: { $ref: './proto/data.schema.json#/$defs/OverlayLog' } },
            },
        }
      responses:
        { '204': { description: Log accepted }, '400': { $ref: '#/components/responses/Error' } }
  /api/host/ready:
    post:
      operationId: reportHostReady
      description: The dashboard reports that its first load finished, so the desktop host can drop the splash window and show it.
      responses: { '204': { description: Dashboard ready } }
  /api/host/close-behavior:
    get:
      operationId: getHostCloseBehavior
      description: The close behavior the desktop host would apply. ask means the dashboard shows the close dialog.
      responses:
        {
          '200':
            {
              description: Close behavior,
              content:
                {
                  application/json:
                    { schema: { $ref: './proto/data.schema.json#/$defs/HostCloseBehavior' } },
                },
            },
        }
  /api/host/events:
    get:
      operationId: openHostEvents
      description: The dashboard's subscription to the desktop host's own state. Named events (host-state, window-state, close-request, open-settings) carry a JSON payload; a comment line keeps the stream alive.
      x-transport: sse
      responses: { '200': { description: Event stream } }
  /ws:
    get:
      operationId: openEventsWebSocket
      x-transport: websocket
      responses: { '101': { description: Switching Protocols } }
  /api/stickers:
    get:
      operationId: listStickers
      responses:
        {
          '200':
            {
              description: Stickers,
              content:
                {
                  application/json:
                    {
                      schema:
                        { type: array, items: { $ref: './proto/data.schema.json#/$defs/Sticker' } },
                    },
                },
            },
        }
  /api/maps:
    get:
      operationId: listMaps
      parameters: [{ $ref: '#/components/parameters/Locale' }]
      responses:
        {
          '200':
            {
              description: Map catalog,
              content:
                {
                  application/json:
                    {
                      schema:
                        {
                          type: array,
                          items: { $ref: './proto/data.schema.json#/$defs/MapSummary' },
                        },
                    },
                },
            },
        }
  /api/maps/{id}:
    get:
      operationId: getMap
      parameters:
        [{ $ref: '#/components/parameters/MapId' }, { $ref: '#/components/parameters/Locale' }]
      responses:
        {
          '200':
            {
              description: Map data,
              content:
                {
                  application/json: { schema: { $ref: './proto/data.schema.json#/$defs/MapData' } },
                },
            },
          '404': { $ref: '#/components/responses/Error' },
        }
  /api/maps/{id}/annotations:
    get:
      operationId: getMapAnnotations
      parameters: [{ $ref: '#/components/parameters/MapId' }]
      responses: { '200': { $ref: '#/components/responses/VersionedAnnotations' } }
    put:
      operationId: putMapAnnotations
      parameters:
        [
          { $ref: '#/components/parameters/MapId' },
          { $ref: '#/components/parameters/ExpectedRevision' },
        ]
      requestBody:
        {
          required: true,
          content:
            {
              application/json: { schema: { $ref: './proto/data.schema.json#/$defs/Annotations' } },
            },
        }
      responses:
        {
          '200': { $ref: '#/components/responses/VersionedAnnotations' },
          '409': { $ref: '#/components/responses/RevisionConflict' },
          '428': { $ref: '#/components/responses/RevisionRequired' },
        }
  /api/maps/{id}/calibration:
    get:
      operationId: getMapCalibration
      parameters:
        [{ $ref: '#/components/parameters/MapId' }, { $ref: '#/components/parameters/Basemap' }]
      responses: { '200': { $ref: '#/components/responses/VersionedCalibration' } }
    put:
      operationId: putMapCalibration
      parameters:
        [
          { $ref: '#/components/parameters/MapId' },
          { $ref: '#/components/parameters/Basemap' },
          { $ref: '#/components/parameters/ExpectedRevision' },
        ]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: './proto/data.schema.json#/$defs/CalibrationDocument' } },
            },
        }
      responses:
        {
          '200': { $ref: '#/components/responses/VersionedCalibration' },
          '409': { $ref: '#/components/responses/RevisionConflict' },
          '428': { $ref: '#/components/responses/RevisionRequired' },
        }
  /api/map-preferences:
    get:
      operationId: getMapPreferences
      responses: { '200': { $ref: '#/components/responses/VersionedPreferences' } }
    put:
      operationId: putMapPreferences
      parameters: [{ $ref: '#/components/parameters/ExpectedRevision' }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json: { schema: { $ref: './proto/data.schema.json#/$defs/Preferences' } },
            },
        }
      responses:
        {
          '200': { $ref: '#/components/responses/VersionedPreferences' },
          '409': { $ref: '#/components/responses/RevisionConflict' },
          '428': { $ref: '#/components/responses/RevisionRequired' },
        }
  /api/marker-preferences:
    get:
      operationId: getMarkerPreferences
      responses: { '200': { $ref: '#/components/responses/VersionedMarkerPreferences' } }
    put:
      operationId: putMarkerPreferences
      parameters: [{ $ref: '#/components/parameters/ExpectedRevision' }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: './proto/data.schema.json#/$defs/MarkerPreferences' } },
            },
        }
      responses:
        {
          '200': { $ref: '#/components/responses/VersionedMarkerPreferences' },
          '409': { $ref: '#/components/responses/RevisionConflict' },
          '428': { $ref: '#/components/responses/RevisionRequired' },
        }
  /api/calibration-preferences:
    get:
      operationId: getCalibrationPreferences
      responses: { '200': { $ref: '#/components/responses/VersionedCalibratorPreferences' } }
    put:
      operationId: putCalibrationPreferences
      parameters: [{ $ref: '#/components/parameters/ExpectedRevision' }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: './proto/data.schema.json#/$defs/CalibratorPreferences' } },
            },
        }
      responses:
        {
          '200': { $ref: '#/components/responses/VersionedCalibratorPreferences' },
          '409': { $ref: '#/components/responses/RevisionConflict' },
          '428': { $ref: '#/components/responses/RevisionRequired' },
        }
  /api/user-settings:
    get:
      operationId: getUserSettings
      responses: { '200': { $ref: '#/components/responses/VersionedUserSettings' } }
    put:
      operationId: putUserSettings
      parameters: [{ $ref: '#/components/parameters/ExpectedRevision' }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: './proto/data.schema.json#/$defs/UserSettings' } },
            },
        }
      responses:
        {
          '200': { $ref: '#/components/responses/VersionedUserSettings' },
          '409': { $ref: '#/components/responses/RevisionConflict' },
          '428': { $ref: '#/components/responses/RevisionRequired' },
        }
  /api/overlay/bootstrap:
    get:
      operationId: getOverlayBootstrap
      responses:
        {
          '200':
            {
              description: Overlay bootstrap,
              content:
                {
                  application/json:
                    { schema: { $ref: './proto/data.schema.json#/$defs/OverlayBootstrap' } },
