        }
      responses: { '204': { description: Started event accepted } }
  /api/recognition-result:
    delete:
      operationId: deleteRecognitionResult
      responses: { '204': { description: Result deleted } }
  /api/recognition/candidates:
    post:
      operationId: postRecognitionCandidates
      requestBody:
