  /signal:
    post:
      operationId: signalMultiplayer
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: './proto/signal.schema.json#/$defs/SignalRequest' } },
            },
        }
      responses:
        '200':
          {
            description: SDP answer,
            content:
              {
                application/json:
                  { schema: { $ref: './proto/signal.schema.json#/$defs/SignalResponse' } },
              },
          }
        '400': { $ref: '#/components/responses/SignalError' }
        '403': { $ref: '#/components/responses/SignalError' }
        '503': { $ref: '#/components/responses/SignalError' }
  /api/cast/interfaces:
    get:
      operationId: getCastInterfaces
      responses:
        {
          '200':
            {
              description: Interfaces,
              content:
                {
                  application/json:
                    { schema: { $ref: './proto/data.schema.json#/$defs/MobileInterfaces' } },
                },
