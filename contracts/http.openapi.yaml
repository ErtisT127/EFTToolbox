      operationId: probeStunServers
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: './proto/data.schema.json#/$defs/StunProbeRequest' } },
            },
        }
      responses:
        {
          '200':
            {
              description: Probe results,
              content:
                {
                  application/json:
                    { schema: { $ref: './proto/data.schema.json#/$defs/StunProbeResults' } },
                },
            },
        }
  /api/multiplayer/nat-check:
    post:
      operationId: checkMultiplayerNat
      responses:
        {
          '200':
            {
              description: NAT result,
              content:
                {
                  application/json:
                    { schema: { $ref: './proto/data.schema.json#/$defs/NatCheckResult' } },
                },
