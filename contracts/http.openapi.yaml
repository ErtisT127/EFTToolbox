        }
      responses:
        {
          '200':
            {
              description: Recognition settings,
              content:
                {
                  application/json:
                    { schema: { $ref: './proto/data.schema.json#/$defs/RecognitionSettings' } },
                },
            },
        }
  /api/recognition/request:
    post:
      operationId: requestRecognition
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: './proto/data.schema.json#/$defs/RecognitionRequest' } },
            },
        }
      responses: { '204': { description: Request accepted } }
  /api/recognition/started:
    post:
      operationId: reportRecognitionStarted
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: './proto/data.schema.json#/$defs/RecognitionStart' } },
